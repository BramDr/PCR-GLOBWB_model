[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]

# the versions source packages (libbmiwofost, pymt_wofost) are built for
[workspace.build-variants]
python = ["3.10.*"]
numpy = ["1.26"]
# > netCDF4 =1.6.4 requires libnetcdf 4.9.2
libnetcdf = ["4.9.2"]

[dependencies]
python = "=3.10.13"
numpy = "=1.26.4"
netCDF4 = "=1.6.4"
zarr = "=2.18.3"
xarray = "=2025.6.1"
pyinterp = "=2025.8.1"
pcraster = ">=4.4.2,<5"
rsync = ">=3.4.2,<4"

[pypi-dependencies]
pcrglobwb = { path = ".", editable = true }

[feature.lint.dependencies]
pre-commit = "=4.6.2"

[feature.dev.dependencies]
act = "=0.2.89"
vulture = "=2.16"

[feature.wofost]
platforms = ["linux-64"]

# built from source with pixi-build (external/wofost/python), together with the C library
[feature.wofost.dependencies]
pymt_wofost = { path = "external/wofost/python" }

[environments]
default = { features = [], solve-group = "default" }
wofost = { features = ["wofost"], solve-group = "default" }
lint = { features = ["lint"], no-default-feature = true }
dev = { features = ["dev", "lint"], solve-group = "default" }
